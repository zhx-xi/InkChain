name: Spec Verification

# Phase 0 gate: every PR/push that touches specs/ or scripts/sdd/
# runs verify-spec.py. Always reports status (green on skip)
# so it can be a required check without blocking non-spec PRs.
#
# Threshold logic (incremental mode):
#   - Detects which specs/*.md files changed in this PR/push
#   - Only verifies THOSE files with --threshold 50
#   - Unchanged modules don't block the PR
#   - If only scripts/sdd/* changed (infra PRs):
#     Run --all without threshold → reports compliance but doesn't block

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: spec-verify-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect spec changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      specs: ${{ steps.filter.outputs.specs }}
      spec-content: ${{ steps.filter.outputs.spec-content }}
      changed-specs: ${{ steps.changed.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            specs:
              - 'specs/**'
              - 'scripts/sdd/**'
            spec-content:
              - 'specs/*.md'
      - name: Get changed spec files
        id: changed
        if: steps.filter.outputs.spec-content == 'true'
        run: |
          # Get the base SHA for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Get changed .md files in specs/ (excluding .report.md and non-spec files)
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- 'specs/*.md' | \
            grep -v '.report.md' | \
            grep -v 'TEMPLATE.md' | \
            grep -v 'INDEX.md' | \
            grep -v 'COMPARISON.md' | \
            tr '\n' ' ')

          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed spec files: $CHANGED"

  verify:
    name: verify
    needs: [detect]
    runs-on: ubuntu-latest
    if: always()  # always report status for required check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run spec verification (incremental, with threshold)
        if: needs.detect.outputs.specs == 'true' && needs.detect.outputs.spec-content == 'true' && needs.detect.outputs.changed-specs != ''
        env:
          INKCHAIN_ROOT: ${{ github.workspace }}
        run: |
          CHANGED="${{ needs.detect.outputs.changed-specs }}"
          echo "=== SDD Spec Verification (incremental, threshold: 50%) ==="
          echo "Files to verify: $CHANGED"
          python scripts/sdd/verify-spec.py $CHANGED --threshold 50
          echo "✅ All changed specs verified (threshold: 50%)"

      - name: Run spec verification (no spec content changed)
        if: needs.detect.outputs.specs == 'true' && needs.detect.outputs.spec-content != 'true'
        env:
          INKCHAIN_ROOT: ${{ github.workspace }}
        run: |
          echo "=== SDD Spec Verification (infra-only, no threshold) ==="
          python scripts/sdd/verify-spec.py --all
          echo "✅ Spec verification completed (infra changes only, no threshold enforced)"

      - name: No spec changes — skip
        if: needs.detect.outputs.specs != 'true'
        run: echo "No spec changes detected. Verification skipped."

      - name: Spec content changed but no files detected — fallback to --all
        if: needs.detect.outputs.specs == 'true' && needs.detect.outputs.spec-content == 'true' && needs.detect.outputs.changed-specs == ''
        env:
          INKCHAIN_ROOT: ${{ github.workspace }}
        run: |
          echo "=== SDD Spec Verification (fallback: --all, threshold: 50%) ==="
          echo "Warning: could not detect changed spec files, running full check."
          python scripts/sdd/verify-spec.py --all --threshold 50
